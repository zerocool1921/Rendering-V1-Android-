name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & (opsional) Sign APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # dibutuhkan untuk membuat GitHub Release saat trigger tag v*

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --- Install Gradle langsung (tidak bergantung pada file gradlew/gradlew.bat/
      # gradle-wrapper.jar di repo, karena ketiganya belum ada di project ini — lihat
      # gradle/wrapper/gradle-wrapper.properties untuk versi yang dipakai project) ---
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # --- (Opsional tapi disarankan) Generate ulang gradle wrapper resmi ke repo,
      # supaya build lokal / sesi berikutnya bisa pakai ./gradlew seperti biasa ---
      - name: Generate gradle wrapper resmi
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      # --- Cek apakah secrets keystore lengkap tersedia ---
      - name: Cek ketersediaan keystore signing
        id: keystore_check
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Jalur 1: secrets lengkap → build assembleRelease + sign manual ---
      - name: Decode keystore dari secrets
        if: steps.keystore_check.outputs.has_keystore == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build APK release (unsigned) via Gradle
        if: steps.keystore_check.outputs.has_keystore == 'true'
        run: gradle assembleRelease --stacktrace

      - name: Sign APK release
        if: steps.keystore_check.outputs.has_keystore == 'true'
        id: sign_release
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK hasil signing
        if: steps.keystore_check.outputs.has_keystore == 'true'
        run: cp "${{ steps.sign_release.outputs.signedReleaseFile }}" app-release-signed.apk

      # --- Jalur 2: secrets belum ada → tetap sukses hasilkan APK debug ---
      - name: Build APK debug (fallback, tanpa signing)
        if: steps.keystore_check.outputs.has_keystore == 'false'
        run: |
          echo "::warning::Secrets KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD belum diisi lengkap — build APK debug saja (bisa langsung diinstall untuk testing, TIDAK bisa dipublikasikan ke Play Store)."
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk

      # --- Upload artifact (selalu jalan, apapun jalurnya) ---
      - name: Upload APK signed sebagai artifact
        if: steps.keystore_check.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app-release-signed.apk
          if-no-files-found: error

      - name: Upload APK debug sebagai artifact
        if: steps.keystore_check.outputs.has_keystore == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-debug.apk
          if-no-files-found: error

      # --- Kalau trigger-nya tag versi (v*), lampirkan APK ke GitHub Release ---
      - name: Buat GitHub Release + lampirkan APK (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release-signed.apk
            app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
